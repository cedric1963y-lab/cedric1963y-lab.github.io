  <h1>仕事の証拠帳</h1>
  <p>現場の写真、メモ、作業時間を、案件ごとのタイムラインに残す iOS アプリです。あとから見返すための業務記録です。法的な証拠そのものを作るアプリではありません。</p>
  <p>写真と案件データは端末の中に保存します。アカウント登録はありません。</p>
  <p>月あたりの新規案件は3件までです。上限を超える新規作成、作業報告書、ビフォーアフター、今月の集計は Pro の自動更新サブスクリプションで使えます。Pro では広告を表示しません。</p>
