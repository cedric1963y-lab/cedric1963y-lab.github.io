<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サポート & お問い合わせ - HAYATO SUZUKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>サポート & お問い合わせ</h1>
        <p>アプリに関する不具合・ご意見・お問い合わせ窓口</p>
    </header>

    <main>
        <a href="index.html" class="back-link">← トップに戻る</a>

        <div class="card">
            <h2>お問い合わせフォーム</h2>
            <p>ご入力いただいた内容をもとに、お使いのメールアプリを起動してお問い合わせを送信します。</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="appSelect">対象アプリ</label>
                    <select id="appSelect" required>
                        <option value="" disabled selected>アプリを選択してください</option>
                        <option value="Ninja Jump">Ninja Jump - Retro Action</option>
                        <option value="SmartCal">SmartCal - 履歴付き電卓</option>
                        <option value="Other">その他 / 一般のお問い合わせ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subjectInput">件名</label>
                    <input type="text" id="subjectInput" placeholder="不具合について、要望など" required>
                </div>

                <div class="form-group">
                    <label for="messageText">お問い合わせ内容</label>
                    <textarea id="messageText" rows="6" placeholder="具体的な症状や端末情報（iOSバージョンなど）をご記載ください。" required></textarea>
                </div>

                <button type="submit" class="btn">メールを作成する</button>
            </form>
        </div>

        <script>
            document.getElementById('contactForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const app = document.getElementById('appSelect').value;
                const subject = document.getElementById('subjectInput').value;
                const bodyText = document.getElementById('messageText').value;
                
                const mailTo = "suzukihayato.apps@gmail.com"; // ★ご自身の連絡先メールアドレスに書き換えてください
                
                const emailSubject = encodeURIComponent(`[アプリ問い合わせ] ${app} - ${subject}`);
                const emailBody = encodeURIComponent(
                    `--- アプリ情報 ---\n` +
                    `対象アプリ: ${app}\n` +
                    `-----------------\n\n` +
                    `お問い合わせ内容:\n${bodyText}`
                );
                
                window.location.href = `mailto:${mailTo}?subject=${emailSubject}&body=${emailBody}`;
            });
        </script>

        <div class="nav-links">
            <a href="index.html">トップページ</a>
            <a href="privacy.html">プライバシーポリシー</a>
        </div>
    </main>
</body>
</html>
